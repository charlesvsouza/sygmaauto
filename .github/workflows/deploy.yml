name: Deploy

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─── Backend: type-check ──────────────────────────────────────────────────
  backend-check:
    name: Backend Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ─── Frontend: build check ────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://placeholder-api.railway.app

  # ─── Deploy: Railway (backend) ───────────────────────────────────────────
  # O deploy do backend é feito pela integração Git nativa do Railway (serviço
  # sygmaauto-api conectado a este repo, branch master, Dockerfile em backend/):
  # todo push em master gera um deploy de produção automaticamente. É o que
  # publicou o commit 080fe01.
  #
  # O job que rodava `railway up --service sygmaauto-api` aqui era um caminho
  # DUPLICADO e vivia vermelho: o secret RAILWAY_TOKEN expirou (o último válido
  # foi criado em 28/04/2026) e o run falhava em ~50s depois do build, dando
  # alarme falso de deploy quebrado enquanto a integração publicava normalmente.
  # Removido em 19/11/2026, mesmo critério do job do Vercel abaixo. Se um dia a
  # integração nativa for desligada, o deploy volta a ser manual:
  #   railway login && railway up --service sygmaauto-api --detach  (com backend/ no cwd)

  # ─── Deploy: Vercel (frontend) ────────────────────────────────────────────
  # O deploy do frontend é feito pela integração Git nativa do Vercel
  # (projeto conectado a este repo, Root Directory = frontend): todo push em
  # master gera um deploy de produção automaticamente. O job de deploy via
  # CLI que existia aqui era um caminho DUPLICADO (dois deploys de produção
  # por push, com risco de corrida no alias) e foi removido em 07/07/2026.
  # O frontend-check acima continua validando o build a cada push.
